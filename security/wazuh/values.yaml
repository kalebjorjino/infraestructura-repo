# Default values for wazuh.

manager:
  enabled: true
  replicaCount: 1
  image:
    repository: wazuh/wazuh-manager
    tag: 4.7.2
    pullPolicy: IfNotPresent
  storage:
    enabled: true
    size: 20Gi
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi
  service:
    type: ClusterIP
    ports:
      agentEvents: 1514
      agentRegistration: 1515
      cluster: 1516
      api: 55000

dashboard:
  enabled: true
  replicaCount: 1
  image:
    repository: wazuh/wazuh-dashboard
    tag: 4.7.2
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 443

serviceAccount:
  create: true
  name: wazuh-sa
