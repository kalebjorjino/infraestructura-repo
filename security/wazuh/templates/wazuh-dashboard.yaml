{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wazuh.fullname" . }}-dashboard-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
data:
  opensearch_dashboards.yml: |
    server.host: 0.0.0.0
    server.port: 5601
    opensearch.hosts: ["http://{{ include "wazuh.fullname" . }}-indexer:9200"]
    opensearch.ssl.verificationMode: none
    opensearch_security.enabled: false
    server.ssl.enabled: false
    uiSettings.overrides.defaultRoute: /app/wazuh
  wazuh.yml: |
    pattern: wazuh-alerts-*
    checks.pattern: true
    checks.template: false
    checks.api: true
    checks.setup: true
    hosts:
      - default:
          url: https://{{ include "wazuh.fullname" . }}-manager
          port: 55000
          username: wazuh-wui
          password: wazuh-wui
          run_as: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wazuh.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      {{- include "wazuh.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        {{- include "wazuh.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: {{ include "wazuh.serviceAccountName" . }}
      containers:
        - name: wazuh-dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5601
          env:
            - name: INDEXER_URL
              value: "http://{{ include "wazuh.fullname" . }}-indexer:9200"
            - name: WAZUH_API_URL
              value: "https://{{ include "wazuh.fullname" . }}-manager"
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          volumeMounts:
            - name: dashboard-config
              mountPath: /usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
              subPath: opensearch_dashboards.yml
            - name: dashboard-config
              mountPath: /usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
              subPath: wazuh.yml
      volumes:
        - name: dashboard-config
          configMap:
            name: {{ include "wazuh.fullname" . }}-dashboard-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wazuh.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - name: http
      port: 5601
      targetPort: 5601
      protocol: TCP
  selector:
    {{- include "wazuh.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
{{- end }}
