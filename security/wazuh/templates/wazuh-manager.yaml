{{- if .Values.manager.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wazuh.fullname" . }}-filebeat-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager
data:
  filebeat.yml: |
    filebeat.modules:
      - module: wazuh
        alerts:
          enabled: true
        archives:
          enabled: false

    setup.template.json.enabled: false
    setup.ilm.enabled: false
    output.elasticsearch:
      hosts: ['http://{{ include "wazuh.fullname" . }}-indexer:9200']

    logging.metrics.enabled: false

    seccomp:
      default_action: allow
      syscalls:
      - action: allow
        names:
        - rseq
---
{{- if .Values.manager.storage.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "wazuh.fullname" . }}-manager-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager
spec:
  accessModes:
    {{- toYaml .Values.manager.storage.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.manager.storage.size }}
  {{- if .Values.manager.storage.storageClassName }}
  storageClassName: {{ .Values.manager.storage.storageClassName | quote }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wazuh.fullname" . }}-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager
spec:
  replicas: {{ .Values.manager.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "wazuh.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: manager
  template:
    metadata:
      labels:
        {{- include "wazuh.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: manager
    spec:
      serviceAccountName: {{ include "wazuh.serviceAccountName" . }}
      containers:
        - name: wazuh-manager
          image: "{{ .Values.manager.image.repository }}:{{ .Values.manager.image.tag }}"
          imagePullPolicy: {{ .Values.manager.image.pullPolicy }}
          ports:
            - name: agent-events
              containerPort: 1514
              protocol: TCP
            - name: registration
              containerPort: 1515
              protocol: TCP
            - name: cluster
              containerPort: 1516
              protocol: TCP
            - name: api
              containerPort: 55000
              protocol: TCP
          resources:
            {{- toYaml .Values.manager.resources | nindent 12 }}
          volumeMounts:
            - name: manager-data
              mountPath: /var/ossec/api/configuration
              subPath: wazuh-api-configuration
            - name: manager-data
              mountPath: /var/ossec/etc
              subPath: wazuh-etc
            - name: manager-data
              mountPath: /var/ossec/logs
              subPath: wazuh-logs
            - name: manager-data
              mountPath: /var/ossec/queue
              subPath: wazuh-queue
            - name: manager-data
              mountPath: /var/ossec/var/multigroups
              subPath: wazuh-var-multigroups
            - name: manager-data
              mountPath: /var/ossec/integrations
              subPath: wazuh-integrations
            - name: manager-data
              mountPath: /var/ossec/active-response/bin
              subPath: wazuh-active-response
            - name: manager-data
              mountPath: /var/ossec/agentless
              subPath: wazuh-agentless
            - name: manager-data
              mountPath: /var/ossec/wodles
              subPath: wazuh-wodles
            - name: manager-data
              mountPath: /var/lib/filebeat
              subPath: filebeat-data
            - name: filebeat-config
              mountPath: /etc/filebeat/filebeat.yml
              subPath: filebeat.yml
      volumes:
        - name: manager-data
          {{- if .Values.manager.storage.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "wazuh.fullname" . }}-manager-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: filebeat-config
          configMap:
            name: {{ include "wazuh.fullname" . }}-filebeat-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wazuh.fullname" . }}-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager
spec:
  type: {{ .Values.manager.service.type }}
  ports:
    - name: agent-events
      port: {{ .Values.manager.service.ports.agentEvents }}
      targetPort: 1514
      protocol: TCP
    - name: registration
      port: {{ .Values.manager.service.ports.agentRegistration }}
      targetPort: 1515
      protocol: TCP
    - name: api
      port: {{ .Values.manager.service.ports.api }}
      targetPort: 55000
      protocol: TCP
  selector:
    {{- include "wazuh.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: manager
{{- end }}
