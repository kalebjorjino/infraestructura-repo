{{- if .Values.indexer.enabled }}
{{- if .Values.indexer.storage.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "wazuh.fullname" . }}-indexer-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.labels" . | nindent 4 }}
    app.kubernetes.io/component: indexer
spec:
  accessModes:
    {{- toYaml .Values.indexer.storage.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.indexer.storage.size }}
  {{- if .Values.indexer.storage.storageClassName }}
  storageClassName: {{ .Values.indexer.storage.storageClassName | quote }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wazuh.fullname" . }}-indexer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.labels" . | nindent 4 }}
    app.kubernetes.io/component: indexer
spec:
  replicas: {{ .Values.indexer.replicaCount }}
  selector:
    matchLabels:
      {{- include "wazuh.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: indexer
  template:
    metadata:
      labels:
        {{- include "wazuh.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: indexer
    spec:
      serviceAccountName: {{ include "wazuh.serviceAccountName" . }}
      containers:
        - name: wazuh-indexer
          image: "{{ .Values.indexer.image.repository }}:{{ .Values.indexer.image.tag }}"
          imagePullPolicy: {{ .Values.indexer.image.pullPolicy }}
          env:
            - name: discovery.type
              value: "single-node"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
          ports:
            - name: http
              containerPort: 9200
              protocol: TCP
            - name: transport
              containerPort: 9300
              protocol: TCP
          resources:
            {{- toYaml .Values.indexer.resources | nindent 12 }}
          volumeMounts:
            - name: indexer-data
              mountPath: /var/lib/wazuh-indexer
      volumes:
        - name: indexer-data
          {{- if .Values.indexer.storage.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "wazuh.fullname" . }}-indexer-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wazuh.fullname" . }}-indexer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.labels" . | nindent 4 }}
    app.kubernetes.io/component: indexer
spec:
  type: {{ .Values.indexer.service.type }}
  ports:
    - name: http
      port: {{ .Values.indexer.service.port }}
      targetPort: 9200
      protocol: TCP
    - name: transport
      port: 9300
      targetPort: 9300
      protocol: TCP
  selector:
    {{- include "wazuh.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: indexer
{{- end }}
