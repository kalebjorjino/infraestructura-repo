{{- if and .Values.ingress.enabled .Values.grafana.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "k8s-monitoring.fullname" . }}-grafana
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-monitoring.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.grafana.tls }}
  tls:
    {{- toYaml .Values.ingress.grafana.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.grafana.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.grafana.path }}
            pathType: {{ .Values.ingress.grafana.pathType }}
            backend:
              service:
                name: {{ include "k8s-monitoring.fullname" . }}-grafana
                port:
                  number: {{ .Values.grafana.service.port }}
{{- end }}
