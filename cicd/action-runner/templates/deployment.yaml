apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "action-runner.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "action-runner.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "action-runner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "action-runner.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "action-runner.serviceAccountName" . }}
      containers:
        - name: runner
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.runner.existingSecret }}
          args:
            - |
              set -euo pipefail
              API_PATH="repos/${RUNNER_REPO}"
              if [ -n "${RUNNER_ORG:-}" ] && [ -z "${RUNNER_REPO:-}" ]; then
                API_PATH="orgs/${RUNNER_ORG}"
              fi
              RUNNER_TOKEN=$(curl -fsSL -X POST \
                -H "Authorization: Bearer ${GITHUB_PAT}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/${API_PATH}/actions/runners/registration-token" | jq -er '.token')
              export RUNNER_TOKEN
              unset GITHUB_PAT
              exec entrypoint.sh
          {{- end }}
          env:
            - name: RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if .Values.runner.organization }}
            - name: RUNNER_ORG
              value: {{ .Values.runner.organization | quote }}
            {{- end }}
            {{- if .Values.runner.repository }}
            - name: RUNNER_REPO
              value: {{ .Values.runner.repository | quote }}
            {{- end }}
            {{- if .Values.runner.existingSecret }}
            - name: GITHUB_PAT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runner.existingSecret | quote }}
                  key: {{ .Values.runner.existingSecretKey | default "GITHUB_PAT" | quote }}
            {{- else }}
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "action-runner.fullname" . }}-auth
                  key: RUNNER_TOKEN
            {{- end }}
            - name: RUNNER_LABELS
              value: {{ join "," .Values.runner.labels | quote }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: runner-data
              mountPath: /runner
      volumes:
        - name: runner-data
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
