# Default values for k8s-monitoring.
global:
  environment: production

namespace:
  create: false
  name: monitoring

rbac:
  create: true
  serviceAccount:
    create: true
    name: monitoring-sa

networkPolicy:
  enabled: false

prometheus:
  enabled: true
  replicaCount: 1
  image:
    repository: prom/prometheus
    tag: v2.50.1
    pullPolicy: IfNotPresent
  retention: "15d"
  storage:
    enabled: true
    size: 20Gi
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 9090

grafana:
  enabled: true
  replicaCount: 1
  image:
    repository: grafana/grafana
    tag: 10.4.0
    pullPolicy: IfNotPresent
  adminUser: admin
  adminPassword: "adminPasswordChangeMe"
  storage:
    enabled: true
    size: 10Gi
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 3000

nodeExporter:
  enabled: true
  image:
    repository: prom/node-exporter
    tag: v1.7.0
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  service:
    port: 9100

kubeStateMetrics:
  enabled: true
  replicaCount: 1
  image:
    repository: registry.k8s.io/kube-state-metrics/kube-state-metrics
    tag: v2.11.0
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  service:
    port: 8080

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  prometheus:
    host: prometheus.local
    path: /
    pathType: Prefix
    tls: []
  grafana:
    host: grafana.local
    path: /
    pathType: Prefix
    tls: []
