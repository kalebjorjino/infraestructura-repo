{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "k8s-monitoring.fullname" . }}-prometheus-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-monitoring.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'windows-servers'
        static_configs:
          - targets: ['10.2.3.225:9182']
            labels:
              instance: 'SERVIDOR_DOMINIO'
              os: 'windows'
              environment: 'production'
              role: 'domain-controller'
          - targets: ['10.2.3.247:9182']
            labels:
              instance: 'SERVIDOR_ARCHIVO'
              os: 'windows'
              environment: 'production'
              role: 'file-server'
          - targets: ['10.2.3.250:9182']
            labels:
              instance: 'ISACWEBTERA'
              os: 'windows'
              environment: 'production'
              role: 'database-server'
              engine: 'sql-server-express'

      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics

      - job_name: 'kubernetes-cadvisor'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_endpoints_name]
            regex: {{ include "k8s-monitoring.fullname" . }}-node-exporter
            action: keep

      - job_name: 'kube-state-metrics'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_endpoints_name]
            regex: {{ include "k8s-monitoring.fullname" . }}-kube-state-metrics
            action: keep

    rule_files:
      - '/etc/prometheus/alert_rules.yml'

  alert_rules.yml: |
    groups:
      - name: windows_servers_alerts
        rules:
          - alert: WindowsServerDown
            expr: up{job="windows-servers"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Servidor Windows {{ "{{ $labels.instance }}" }} esta FUERA DE LINEA"
              description: "El servidor {{ "{{ $labels.instance }}" }} ({{ "{{ $labels.role }}" }}) no responde a Prometheus desde hace mas de 1 minuto."

          - alert: WindowsHighCpuUsage
            expr: 100 - (avg by (instance) (rate(windows_cpu_time_total{mode="idle"}[2m])) * 100) > 85
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: "Alto consumo de CPU en {{ "{{ $labels.instance }}" }}"
              description: "La CPU de {{ "{{ $labels.instance }}" }} supera el 85% durante mas de 3 minutos (Valor actual: {{ "{{ $value }}" }}%)."

          - alert: WindowsDiskSpaceLow
            expr: 100 * (windows_logical_disk_free_bytes{volume=~"[A-Z]:"} / windows_logical_disk_size_bytes{volume=~"[A-Z]:"}) < 15
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Poco espacio en disco {{ "{{ $labels.volume }}" }} en {{ "{{ $labels.instance }}" }}"
              description: "El volumen {{ "{{ $labels.volume }}" }} en {{ "{{ $labels.instance }}" }} tiene menos del 15% libre (Valor actual: {{ "{{ $value }}" }}%)."

          # 4. Caida del Motor de Base de Datos SQL Server
          - alert: WindowsSqlServerDown
            expr: windows_service_state{name="mssql$isacwebtera",state="running"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Servicio SQL Server DETENIDO en {{ "{{ $labels.instance }}" }}"
              description: "El motor de base de datos SQL Server Express en {{ "{{ $labels.instance }}" }} esta detenido. El sistema SIGSS no puede operar."

          # 5. Caida de Active Directory
          - alert: WindowsActiveDirectoryDown
            expr: windows_service_state{name="ntds",state="running"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Servicio Active Directory DETENIDO en {{ "{{ $labels.instance }}" }}"
              description: "El servicio NTDS de Active Directory en {{ "{{ $labels.instance }}" }} esta detenido. Los usuarios no podran iniciar sesion en el dominio."

          # 6. Caida del Servidor DNS
          - alert: WindowsDnsServerDown
            expr: windows_service_state{name="dns",state="running"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Servidor DNS DETENIDO en {{ "{{ $labels.instance }}" }}"
              description: "El servidor DNS en {{ "{{ $labels.instance }}" }} esta detenido. La resolucion de nombres en la red del hospital fallara."
{{- end }}
